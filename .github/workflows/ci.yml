
name: DaNang Guide CI

on:
  push:
    branches:
      - main
      - hiep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Backend syntax
        run: python -m compileall -q backend training tests

      - name: Check Frontend syntax
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done

      - name: Check required files
        run: |
          test -f backend/main.py
          test -f backend/database.py
          test -f frontend/index.html
          test -f frontend/login.html
          test -f requirements.txt
          test -f render.yaml

      - name: Train AI model
        run: python training/src/train_intent_v2.py --final

      - name: Train slot extraction model
        run: |
          python training/src/generate_slots.py
          python training/src/train_slots.py

      - name: Verify AI model
        run: |
          test -f training/models/intent_classifier.joblib
          test -f training/models/slot_tagger.joblib
          python -c "import joblib; joblib.load('training/models/intent_classifier.joblib'); joblib.load('training/models/slot_tagger.joblib'); print('AI MODELS OK')"

      - name: Run regression tests
        run: python -m pytest -q tests
