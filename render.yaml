
services:
  - type: web
    name: danang-guide
    runtime: python
    plan: free
    branch: hiep

    buildCommand: |
      pip install -r requirements.txt
      python training/src/train_intent_v2.py --final
      python training/src/generate_slots.py
      python training/src/train_slots.py
      test -f training/models/intent_classifier.joblib
      test -f training/models/slot_tagger.joblib

    startCommand: >-
      uvicorn backend.main:app
      --host 0.0.0.0
      --port $PORT

    autoDeployTrigger: off

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"

      - key: APP_ENV
        value: production

      - key: ENABLE_DEMO_ADMIN
        value: "false"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_REDIRECT_URI
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: FACEBOOK_APP_ID
        sync: false

      - key: FACEBOOK_APP_SECRET
        sync: false

      - key: FACEBOOK_REDIRECT_URI
        sync: false

      - key: FACEBOOK_GRAPH_VERSION
        value: v24.0

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.8-flash

      - key: PUBLIC_ORIGIN
        sync: false
