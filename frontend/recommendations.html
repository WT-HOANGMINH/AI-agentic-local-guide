
<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Agentic AI Local Guide — Du lịch Đà Nẵng"
  >

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <!-- CSS của dự án -->
  <link rel="stylesheet" href="css/style.css">

  <title>Gợi ý địa điểm | DaNang Guide</title>
</head>

<body>

  <!-- Thanh điều hướng -->
  <div id="site-nav"></div>

  <!-- Nội dung chính -->
  <main class="container page">

    <!-- Tiêu đề trang -->
    <div class="section-head">

      <div>
        <div class="eyebrow">
          Recommendation
        </div>

        <h1 class="mb-1">
          Địa điểm gợi ý
        </h1>

        <p class="muted mb-0">
          Trong bản demo, gợi ý dựa trên xếp hạng minh họa.
        </p>
      </div>

    </div>

    <!-- Khu vực thông báo -->
    <div id="message"></div>

    <!-- Bộ lọc gợi ý địa điểm -->
    <div class="card-soft p-3 mb-4">

      <label
        for="recommend-category"
        class="form-label"
      >
        Bạn quan tâm đến điều gì?
      </label>

      <select
        id="recommend-category"
        class="form-select"
        style="max-width: 330px"
      >
        <option value="all">Tất cả danh mục</option>
        <option>Tham quan</option>
        <option>Biển</option>
        <option>Thiên nhiên</option>
        <option>Văn hóa</option>
        <option>Ẩm thực</option>
      </select>

    </div>

    <!-- Danh sách địa điểm được gợi ý -->
    <div
      class="row g-4"
      id="recommend-grid"
    ></div>

  </main>

  <!-- Chân trang -->
  <div id="site-footer"></div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Cấu hình dự án -->
  <script src="js/config.js?v=2"></script>

  <!-- Dữ liệu địa điểm -->
  <script src="js/data.js"></script>

  <!-- Kết nối API -->
  <script src="js/api.js?v=2"></script>

  <!-- Giao diện chung -->
  <script src="js/common.js?v=place-images-3"></script>

  <!-- Xử lý gợi ý địa điểm -->
  <script src="js/recommendations.js"></script>
  <script src="js/oauth-ui.js"></script>

</body>
</html>
