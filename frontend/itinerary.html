
<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Agentic AI Local Guide — Du lịch Đà Nẵng"
  >

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css?v=chat-ui-polish-5">

  <!-- CSS rieng cho trang lich trinh -->
  <link
    rel="stylesheet"
    href="css/itinerary.css?v=integration-1"
  >

  <title>Lịch trình của tôi | DaNang Guide</title>
</head>

<body>

  <!-- Thanh dieu huong -->
  <div id="site-nav"></div>

  <!-- Noi dung chinh -->
  <main class="container page itinerary-page">

    <!-- TIEU DE -->
    <div class="section-head itinerary-header">

      <div>
        <div class="eyebrow">TRIP PLANNER</div>

        <h1>Lịch trình của tôi</h1>

        <p class="muted">
          Quản lý và theo dõi chuyến đi Đà Nẵng.
        </p>
      </div>

      <span class="tag" id="itinerary-count">
        0 lịch trình
      </span>

    </div>

    <!-- Thong bao -->
    <div id="message"></div>

    <!-- BO CUC HAI COT -->
    <div class="itinerary-layout">

      <!-- COT TRAI: DANH SACH LICH TRINH -->
      <section class="itinerary-main">

        <div id="itinerary-list"></div>

        <a
          href="places.html"
          class="btn btn-primary mt-3"
        >
          + Thêm địa điểm
        </a>

      </section>

      <!-- COT PHAI: TONG QUAN -->
      <aside class="itinerary-sidebar">

        <div class="itinerary-summary">

          <h2>Thông tin chuyến đi</h2>

          <div class="summary-item">
            <span>Số địa điểm</span>
            <strong id="summary-places">
              0 địa điểm
            </strong>
          </div>

          <div class="summary-item">
            <span>Thời gian</span>
            <strong id="summary-days">
              0 ngày
            </strong>
          </div>

          <div class="summary-item">
            <span>Tổng chi phí</span>
            <strong id="summary-cost">
              0 ₫
            </strong>
          </div>

        </div>

      </aside>

    </div>

  </main>

  <!-- Chan trang -->
  <div id="site-footer"></div>

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Cau hinh -->
  <script src="js/config.js?v=2"></script>

  <!-- Du lieu dia diem -->
  <script src="js/data.js"></script>

  <!-- API cua main -->
  <script src="js/api.js?v=3"></script>

  <!-- Giao dien chung -->
  <script src="js/common.js?v=chat-ui-polish-5"></script>

  <!-- Xu ly lich trinh cua main -->
  <script src="js/itinerary.js?v=integration-confirm-1"></script>

  <!-- OAuth -->
  <script src="js/oauth-ui.js"></script>

</body>
</html>
