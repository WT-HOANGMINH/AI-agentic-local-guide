
<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Agentic AI Local Guide — Du lịch Đà Nẵng"
  >

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <title>Lịch trình của tôi | DaNang Guide</title>
</head>

<body>

  <!-- Thanh điều hướng -->
  <div id="site-nav"></div>

  <!-- Nội dung chính -->
  <main class="container page">

    <!-- Tiêu đề trang -->
    <div class="section-head">

      <div>
        <div class="eyebrow">Trip planner</div>

        <h1 class="mb-1">
          Lịch trình của tôi
        </h1>

        <p class="muted mb-0">
          Danh sách các điểm dừng đã thêm
          (chưa tối ưu tuyến đường).
        </p>
      </div>

      <!-- Số lượng địa điểm -->
      <span class="tag" id="itinerary-count">
        0 điểm dừng
      </span>

    </div>

    <!-- Thông báo -->
    <div id="message"></div>

    <!-- Danh sách lịch trình -->
    <section class="card-soft p-4">

      <div id="itinerary-list"></div>

      <a
        href="places.html"
        class="btn btn-primary mt-3"
      >
        + Thêm địa điểm
      </a>

    </section>

  </main>

  <!-- Chân trang -->
  <div id="site-footer"></div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Cấu hình -->
  <script src="js/config.js"></script>

  <!-- Dữ liệu địa điểm -->
  <script src="js/data.js"></script>

  <!-- API -->
  <script src="js/api.js"></script>

  <!-- Thành phần giao diện chung -->
  <script src="js/common.js"></script>

  <!-- Xử lý lịch trình -->
  <script src="js/itinerary.js"></script>
  <script src="js/oauth-ui.js"></script>

</body>
</html>
