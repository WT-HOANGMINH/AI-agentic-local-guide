
<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DaNang Guide — Du lịch Đà Nẵng">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css?v=switch-toggle-3">

  <title>Đăng ký | DaNang Guide</title>

  <style>
    .social-register {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .social-register:hover {
      opacity: 0.9;
    }

    .google-register {
      background: #fff;
      border: 1px solid #dadce0;
      color: #202124;
    }

    .facebook-register {
      background: #1877f2;
      border: 1px solid #1877f2;
      color: #fff;
    }

    .facebook-register:hover {
      background: #166fe5;
      color: #fff;
    }

    .social-icon {

      width: 21px;
      height: 21px;
      object-fit: contain;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #77817d;
      font-size: 12px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dee2e6;
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <main class="container page">
    <section class="card-soft auth-shell">
      <div class="card-body">

        <div class="eyebrow">Bắt đầu hành trình</div>
        <h1 class="h2 mb-3">Tạo tài khoản</h1>

        <div id="message"></div>

        <form id="auth-form" data-type="register">
          <label class="form-label" for="name">Họ và tên</label>
          <input
            class="form-control mb-3"
            id="name"
            name="name"
            type="text"
            required
            autocomplete="name"
          >

          <label class="form-label" for="email">Email</label>
          <input
            class="form-control mb-3"
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
          >

          <label class="form-label" for="password">
            Mật khẩu (tối thiểu 6 ký tự)
          </label>
          <input
            class="form-control mb-4"
            id="password"
            name="password"
            type="password"
            minlength="6"
            required
            autocomplete="new-password"
          >

          <button type="submit" class="btn btn-primary w-100 py-2">
            Đăng ký
          </button>
        </form>

        <div class="auth-divider">
          HOẶC ĐĂNG KÝ VỚI
        </div>

        <div class="d-grid gap-3">
          <div id="google-signin-btn-container" class="w-100 d-flex justify-content-center"></div>

          <div class="text-center mt-0 mb-1">
            <a href="#" id="google-quick-help" class="text-secondary small" style="font-size: 12px; text-decoration: none;">
              Tùy chọn đăng ký Google khác (Tài khoản thử nghiệm)
            </a>
          </div>

          <button
            type="button"
            class="social-register facebook-register"
            id="facebook-register-btn"
          >
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <span>Đăng ký với Facebook</span>
          </button>

          <div class="text-center mt-0">
            <a href="#" id="facebook-quick-help" class="text-secondary small" style="font-size: 12px; text-decoration: none;">
              Tùy chọn đăng ký Facebook khác (Tài khoản thử nghiệm / Quick Login)
            </a>
          </div>
        </div>


        <p class="mt-4 mb-0 text-center muted">
          Đã có tài khoản?
          <a href="login.html">Đăng nhập</a>
        </p>

        <p class="small muted mt-3 text-center">
          Tài khoản mạng xã hội sẽ được kết nối sau khi hoàn tất cấu hình OAuth.
        </p>

      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/vi_VN/sdk.js"></script>
  <script src="js/config.js?v=social-auth-v4"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js?v=social-auth-v4"></script>
  <script src="js/common.js?v=switch-toggle-3"></script>
  <script src="js/auth.js?v=fb-auth-v1"></script>

</body>
</html>
