
<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DaNang Guide — Du lịch Đà Nẵng">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">

  <title>Đăng ký | DaNang Guide</title>

  <style>
    .social-register {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .social-register:hover {
      opacity: 0.9;
    }

    .google-register {
      background: #fff;
      border: 1px solid #dadce0;
      color: #202124;
    }

    .facebook-register {
      background: #1877f2;
      border: 1px solid #1877f2;
      color: #fff;
    }

    .social-icon {
      width: 21px;
      height: 21px;
      object-fit: contain;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #77817d;
      font-size: 12px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dee2e6;
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <main class="container page">
    <section class="card-soft auth-shell">
      <div class="card-body">

        <div class="eyebrow">Bắt đầu hành trình</div>
        <h1 class="h2 mb-3">Tạo tài khoản</h1>

        <div id="message"></div>

        <form id="auth-form" data-type="register">
          <label class="form-label" for="name">Họ và tên</label>
          <input
            class="form-control mb-3"
            id="name"
            name="name"
            type="text"
            required
            autocomplete="name"
          >

          <label class="form-label" for="email">Email</label>
          <input
            class="form-control mb-3"
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
          >

          <label class="form-label" for="password">
            Mật khẩu (tối thiểu 6 ký tự)
          </label>
          <input
            class="form-control mb-4"
            id="password"
            name="password"
            type="password"
            minlength="6"
            required
            autocomplete="new-password"
          >

          <button type="submit" class="btn btn-primary w-100 py-2">
            Đăng ký
          </button>
        </form>

        <div class="auth-divider">
          HOẶC ĐĂNG KÝ VỚI
        </div>

        <div class="d-grid gap-3">
          <button
            type="button"
            class="social-register google-register"
            id="google-register"
          >
            <img
              class="social-icon"
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt=""
            >
            Tiếp tục với Google
          </button>

          <button
            type="button"
            class="social-register facebook-register"
            id="facebook-register"
          >
            <span aria-hidden="true" style="font-size:22px">f</span>
            Tiếp tục với Facebook
          </button>
        </div>

        <p class="mt-4 mb-0 text-center muted">
          Đã có tài khoản?
          <a href="login.html">Đăng nhập</a>
        </p>

        <p class="small muted mt-3 text-center">
          Tài khoản mạng xã hội sẽ được kết nối sau khi hoàn tất cấu hình OAuth.
        </p>

      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Chua ket noi OAuth that.
    // Khong gia lap dang ky thanh cong.

    document.getElementById('google-register').addEventListener('click', () => {
      const message = document.getElementById('message');
      message.className = 'alert alert-info mt-3';
      message.textContent =
        'Google Login chưa được cấu hình. Hãy hoàn tất OAuth ở backend trước.';
    });

    document.getElementById('facebook-register').addEventListener('click', () => {
      const message = document.getElementById('message');
      message.className = 'alert alert-info mt-3';
      message.textContent =
        'Facebook Login chưa được cấu hình. Hãy hoàn tất OAuth ở backend trước.';
    });
  </script>
</body>
</html>
