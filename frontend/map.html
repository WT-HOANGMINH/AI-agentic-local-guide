
<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Agentic AI Local Guide — Du lịch Đà Nẵng"
  >

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <!-- CSS của dự án -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <title>Bản đồ | DaNang Guide</title>
</head>

<body>

  <!-- Thanh điều hướng -->
  <div id="site-nav"></div>

  <!-- Nội dung chính -->
  <main class="container page">

    <!-- Tiêu đề trang bản đồ -->
    <div class="section-head">

      <div>
        <div class="eyebrow">
          OpenStreetMap + Leaflet
        </div>

        <h1 class="mb-1">
          Bản đồ Đà Nẵng
        </h1>

        <p class="muted mb-0">
          Xem vị trí của các điểm đến trên bản đồ tương tác.
        </p>
      </div>

      <!-- Số lượng địa điểm -->
      <span id="map-count" class="tag">
        Đang tải…
      </span>

    </div>

    <!-- Thông báo -->
    <div id="message"></div>

    <!-- Bộ lọc và vị trí hiện tại -->
    <div class="card-soft p-3 mb-3">

      <div class="d-flex gap-2 flex-wrap align-items-end">

        <!-- Lọc địa điểm theo danh mục -->
        <div>
          <label class="form-label" for="map-category">
            Lọc địa điểm
          </label>

          <select class="form-select" id="map-category">
            <option value="all">Tất cả danh mục</option>
            <option>Tham quan</option>
            <option>Biển</option>
            <option>Thiên nhiên</option>
            <option>Văn hóa</option>
            <option>Ẩm thực</option>
          </select>
        </div>

        <!-- Nút lấy vị trí người dùng -->
        <button
          class="btn btn-outline-primary"
          id="my-location"
          type="button"
        >
          ◎ Vị trí của tôi
        </button>

      </div>
    </div>

    <!-- Bản đồ Leaflet -->
    <div
      id="map"
      class="map-box"
      aria-label="Bản đồ các địa điểm Đà Nẵng"
    ></div>

    <!-- Các địa điểm chưa xác minh tọa độ -->
    <div id="unverified-places"></div>

    <!-- Ghi chú dữ liệu -->
    <p class="small muted mt-3">
      Tọa độ và đánh giá chỉ dùng để minh họa;
      kiểm tra lại trước khi sử dụng thực tế.
      Bản đồ cần Internet để tải tiles OpenStreetMap.
    </p>

  </main>

  <!-- Chân trang -->
  <div id="site-footer"></div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Cấu hình dự án -->
  <script src="js/config.js"></script>

  <!-- Dữ liệu địa điểm -->
  <script src="js/data.js"></script>

  <!-- API -->
  <script src="js/api.js"></script>

  <!-- Giao diện chung -->
  <script src="js/common.js"></script>

  <!-- Thư viện bản đồ Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Xử lý bản đồ -->
  <script src="js/map.js"></script>
  <script src="js/oauth-ui.js"></script>

</body>
</html>
