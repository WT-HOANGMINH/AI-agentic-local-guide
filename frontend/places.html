
<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Agentic AI Local Guide — Du lịch Đà Nẵng"
  >

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <!-- CSS của dự án -->
  <link rel="stylesheet" href="css/style.css">

  <title>Khám phá địa điểm | DaNang Guide</title>
</head>

<body>

  <!-- Thanh điều hướng -->
  <div id="site-nav"></div>

  <!-- Nội dung chính -->
  <main class="container page">

    <!-- Tiêu đề trang -->
    <div class="section-head">

      <div>
        <div class="eyebrow">
          Place discovery
        </div>

        <h1 class="mb-1">
          Khám phá Đà Nẵng
        </h1>

        <p class="muted mb-0">
          Tìm địa điểm phù hợp cho hành trình của bạn.
        </p>
      </div>

      <!-- Số lượng địa điểm -->
      <span id="count" class="tag">
        Đang tải…
      </span>

    </div>

    <!-- Khu vực thông báo -->
    <div id="message"></div>

    <!-- Form tìm kiếm địa điểm -->
    <form id="search-form" class="card-soft p-3 mb-4">

      <div class="row g-3">

        <!-- Ô nhập từ khóa tìm kiếm -->
        <div class="col-md-7">
          <label class="form-label" for="query">
            Tìm kiếm
          </label>

          <input
            id="query"
            class="form-control"
            placeholder="Ví dụ: Cầu Rồng, biển, bảo tàng…"
          >
        </div>

        <!-- Bộ lọc danh mục -->
        <div class="col-md-3">
          <label for="category" class="form-label">
            Danh mục
          </label>

          <select id="category" class="form-select">
            <option value="all">Tất cả danh mục</option>
            <option>Tham quan</option>
            <option>Biển</option>
            <option>Thiên nhiên</option>
            <option>Văn hóa</option>
            <option>Ẩm thực</option>
          </select>
        </div>

        <!-- Nút tìm kiếm -->
        <div class="col-md-2 d-flex align-items-end">
          <button
            class="btn btn-primary w-100 py-2"
            type="submit"
          >
            Tìm kiếm
          </button>
        </div>

      </div>
    </form>

    <!-- Danh sách địa điểm -->
    <div id="places-grid" class="row g-4"></div>

    <!-- Chuyển đến lịch trình -->
    <a
      class="btn btn-outline-primary mt-4"
      href="itinerary.html"
    >
      Xem lịch trình đã lưu →
    </a>

  </main>

  <!-- Chân trang -->
  <div id="site-footer"></div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Cấu hình dự án -->
  <script src="js/config.js"></script>

  <!-- Dữ liệu địa điểm -->
  <script src="js/data.js"></script>

  <!-- Kết nối API -->
  <script src="js/api.js"></script>

  <!-- Giao diện chung -->
  <script src="js/common.js"></script>

  <!-- Xử lý tìm kiếm và hiển thị địa điểm -->
  <script src="js/places.js"></script>
  <script src="js/oauth-ui.js"></script>

</body>
</html>
