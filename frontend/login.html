
<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DaNang Guide — Du lịch Đà Nẵng">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">

  <title>Đăng nhập | DaNang Guide</title>

  <style>
    .social-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .social-login:hover {
      opacity: 0.9;
    }

    .google-login {
      background: #fff;
      border: 1px solid #dadce0;
      color: #202124;
    }

    .facebook-login {
      background: #1877f2;
      border: 1px solid #1877f2;
      color: #fff;
    }

    .social-icon {
      width: 21px;
      height: 21px;
      object-fit: contain;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #77817d;
      font-size: 12px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dee2e6;
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <main class="container page">
    <section class="card-soft auth-shell">
      <div class="card-body">

        <div class="eyebrow">Chào mừng trở lại</div>
        <h1 class="h2 mb-3">Đăng nhập</h1>

        <div id="message" role="status"></div>

        <form id="auth-form" data-type="login">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-control mb-3"
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
          >

          <label class="form-label" for="password">Mật khẩu</label>
          <input
            class="form-control mb-4"
            id="password"
            name="password"
            type="password"
            required
            minlength="6"
            autocomplete="current-password"
          >

          <button type="submit" class="btn btn-primary w-100 py-2">
            Đăng nhập
          </button>
        </form>

        <div class="auth-divider">
          HOẶC ĐĂNG NHẬP VỚI
        </div>

        <div class="d-grid gap-3">
          <button
            type="button"
            class="social-login google-login"
            id="google-login"
          >
            <img
              class="social-icon"
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt=""
            >
            Tiếp tục với Google
          </button>

          <button
            type="button"
            class="social-login facebook-login"
            id="facebook-login"
          >
            <span aria-hidden="true" style="font-size:22px">f</span>
            Tiếp tục với Facebook
          </button>
        </div>

        <p class="mt-4 mb-0 text-center muted">
          Chưa có tài khoản?
          <a href="register.html">Đăng ký</a>
        </p>

        <p class="small muted mt-3 text-center">
          Đăng nhập với Google hoặc bằng email và mật khẩu.
        </p>

      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const BACKEND_URL = "http://127.0.0.1:8000";
    const messageBox = document.getElementById("message");

    function showMessage(text, type = "info") {
      messageBox.className = `alert alert-${type} mt-3`;
      messageBox.textContent = text;
    }

    // ĐĂNG NHẬP BẰNG GOOGLE
    document.getElementById("google-login").addEventListener("click", () => {
      window.location.href = BACKEND_URL + "/api/auth/google";
    });

    // FACEBOOK: CHƯA CẤU HÌNH
    document.getElementById("facebook-login").addEventListener("click", () => {
      showMessage(
        "Facebook Login đang được phát triển. Vui lòng sử dụng Google hoặc email.",
        "info"
      );
    });

    // XỬ LÝ KẾT QUẢ GOOGLE OAUTH
    async function handleGoogleCallback() {
      const params = new URLSearchParams(window.location.search);
      const authStatus = params.get("oauth") || params.get("auth");

      if (authStatus !== "success") {
        if (authStatus === "error") {
          showMessage(
            "Đăng nhập Google không thành công. Vui lòng thử lại.",
            "danger"
          );
        }
        return;
      }

      showMessage("Đang xác minh tài khoản Google...", "info");

      try {
        const response = await fetch(
          BACKEND_URL + "/api/auth/me",
          {
            method: "GET",
            credentials: "include",
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (!response.ok) {
          throw new Error("Không thể xác minh phiên đăng nhập.");
        }

        const data = await response.json();

        if (!data.user || !data.user.id) {
          throw new Error("Không tìm thấy thông tin tài khoản.");
        }

        // Lưu thông tin hiển thị, không lưu token hoặc secret
        sessionStorage.setItem(
          "danang_oauth_user",
          JSON.stringify(data.user)
        );

        showMessage(
          "Đăng nhập Google thành công! Đang chuyển về trang chủ...",
          "success"
        );

        // Chuyển về trang chủ
        window.location.replace("index.html?auth=success");

      } catch (error) {
        console.error("Google OAuth:", error);
        showMessage(
          "Google đã chuyển về website nhưng không thể xác minh phiên đăng nhập. Kiểm tra Backend và CORS.",
          "danger"
        );
      }
    }

    handleGoogleCallback();
  </script>
</body>
</html>
