<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DaNang Guide — Du lịch Đà Nẵng">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css?v=switch-toggle-3">

  <title>Đăng nhập | DaNang Guide</title>

  <style>
    .social-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .social-login:hover {
      opacity: 0.9;
    }

    .google-login {
      background: #fff;
      border: 1px solid #dadce0;
      color: #202124;
    }

    .social-icon {
      width: 21px;
      height: 21px;
      object-fit: contain;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #77817d;
      font-size: 12px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dee2e6;
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <main class="container page">
    <section class="card-soft auth-shell">
      <div class="card-body">

        <div class="eyebrow">Chào mừng trở lại</div>
        <h1 class="h2 mb-3">Đăng nhập</h1>

        <div id="message"></div>

        <form id="auth-form" data-type="login">
          <label class="form-label" for="email">Email</label>
          <input class="form-control mb-3" id="email" name="email" type="email" required autocomplete="email">

          <label class="form-label" for="password">Mật khẩu</label>
          <input class="form-control mb-4" id="password" name="password" type="password" required minlength="6"
            autocomplete="current-password">

          <button type="submit" class="btn btn-primary w-100 py-2">
            Đăng nhập
          </button>
        </form>

        <div class="auth-divider">
          HOẶC ĐĂNG NHẬP VỚI
        </div>

        <div class="d-grid gap-3">
          <div id="google-signin-btn-container" class="w-100 d-flex justify-content-center"></div>

          <div class="text-center mt-1">
            <a href="#" id="google-quick-help" class="text-secondary small" style="font-size: 12px; text-decoration: none;">
              Tùy chọn đăng nhập Google khác (Tài khoản thử nghiệm)
            </a>
          </div>
        </div>

        <p class="mt-4 mb-0 text-center muted">
          Chưa có tài khoản?
          <a href="register.html">Đăng ký</a>
        </p>

        <p class="small muted mt-3 text-center">
          Đăng nhập mạng xã hội sẽ hoạt động sau khi hoàn tất cấu hình OAuth.
        </p>

      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/config.js?v=social-auth-v3"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js?v=social-auth-v3"></script>
  <script src="js/common.js?v=switch-toggle-3"></script>
  <script src="js/auth.js?v=no-fb-1"></script>

</body>

</html>
