
<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Chi tiết địa điểm | DaNang Guide</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    .detail-wrap {
      max-width: 1080px;
      padding-top: 30px;
      padding-bottom: 50px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      align-items: start;
    }

    .detail-panel {
      background: #fff;
      border: 1px solid #e2e9e6;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .detail-photo {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 12px;
      background: #edf3f0;
    }

    .detail-photo-fallback {
      min-height: 240px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #e5f0ec, #d2e3dc);
      color: #176b60;
      font-size: 52px;
    }

    #detail-map {
      height: 360px;
      width: 100%;
      border-radius: 12px;
      background: #edf3f0;
    }

    .detail-label {
      color: #71817b;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 18px;
    }

    @media (max-width: 767px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-photo {
        height: 240px;
      }
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <main class="container page detail-wrap">
    <p>
      <a href="index.html">Trang chủ</a> /
      <a href="places.html">Địa điểm</a> /
      Chi tiết
    </p>

    <div id="detail-status" class="alert alert-info">
      Đang tải thông tin địa điểm...
    </div>

    <section id="place-detail" hidden></section>
    <div id="message"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js?v=place-images-3"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/place-detail.js?v=place-images-3"></script>
</body>
</html>
