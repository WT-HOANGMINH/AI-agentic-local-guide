<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Chi tiết địa điểm | DaNang Guide</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css?v=switch-toggle-3">
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    .detail-wrap {
      max-width: 1140px;
      padding-top: 24px;
      padding-bottom: 60px;
    }

    .breadcrumb-nav {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 18px;
    }
    .breadcrumb-nav a {
      color: #0d9488;
      text-decoration: none;
      font-weight: 500;
    }
    .breadcrumb-nav a:hover {
      text-decoration: underline;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 28px;
      align-items: start;
    }

    .detail-panel {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      transition: box-shadow 0.2s ease;
    }

    .detail-photo {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 14px;
      background: #edf3f0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .detail-photo-fallback {
      min-height: 280px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #e5f0ec, #d2e3dc);
      color: #176b60;
      font-size: 64px;
    }

    .detail-label {
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 18px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .info-card-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-card-value {
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      margin: 0;
      line-height: 1.45;
    }

    .info-card-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .highlight-panel {
      background: linear-gradient(135deg, #f0fdfa, #f8fafc);
      border-left: 4px solid #0d9488;
    }

    .tips-panel {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      border-radius: 12px;
      padding: 16px;
      margin-top: 18px;
    }

    .btn-fav {
      transition: all 0.2s ease;
    }
    .btn-fav.active {
      background-color: #ffe4e6;
      border-color: #f43f5e;
      color: #e11d48;
    }

    #detail-map {
      height: 380px;
      width: 100%;
      border-radius: 14px;
      background: #edf3f0;
      border: 1px solid #e2e8f0;
    }

    .related-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .related-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      color: inherit;
    }
    .related-img {
      height: 140px;
      width: 100%;
      object-fit: cover;
      background: #e2e8f0;
    }

    @media (max-width: 900px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }
      .detail-photo {
        height: 260px;
      }
    }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <main class="container page detail-wrap">
    <div class="breadcrumb-nav">
      <a href="index.html">Trang chủ</a> /
      <a href="places.html">Địa điểm</a> /
      <span id="breadcrumb-place-name">Chi tiết địa điểm</span>
    </div>

    <div id="detail-status" class="alert alert-info">
      Đang tải thông tin địa điểm...
    </div>

    <section id="place-detail" hidden></section>
    <div id="message"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js?v=switch-toggle-3"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/place-detail.js?v=place-images-3"></script>
</body>
</html>
